<div class="card border-warning shadow-sm mb-4">
  <div class="card-header bg-warning-subtle fw-semibold">Respuesta del cliente</div>

  <div class="card-body">
    @if (mensajeError()) {
      <div class="alert alert-danger">{{ mensajeError() }}</div>
    }

    @if (pendientes().length === 0) {
      <p class="text-muted mb-0">No hay trabajos esperando respuesta.</p>
    } @else {
      @for (trabajo of pendientes(); track trabajo.id) {
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span>
            {{ trabajo.titulo }}
            <span class="text-muted small ms-2">{{ trabajo.subtotal | currency: 'PEN' }}</span>
          </span>
          <div class="btn-group btn-group-sm">
            <button class="btn"
                    [class.btn-success]="decisiones()[trabajo.id] === true"
                    [class.btn-outline-success]="decisiones()[trabajo.id] !== true"
                    (click)="marcar(trabajo.id, true)">Aprueba</button>
            <button class="btn"
                    [class.btn-danger]="decisiones()[trabajo.id] === false"
                    [class.btn-outline-danger]="decisiones()[trabajo.id] !== false"
                    (click)="marcar(trabajo.id, false)">Rechaza</button>
          </div>
        </div>
      }

      <button class="btn btn-warning mt-3" [disabled]="guardando()" (click)="registrar()">
        Registrar la respuesta
      </button>
    }
  </div>
</div>
